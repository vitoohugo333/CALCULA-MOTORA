name: Deploy VETTA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static production
        run: |
          node --check app.js
          node --check sw.js
          node tests/verify-production.mjs

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html app.js styles.css manifest.webmanifest icon.svg sw.js netlify.toml _site/
          if [ -f .nojekyll ]; then cp .nojekyll _site/; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

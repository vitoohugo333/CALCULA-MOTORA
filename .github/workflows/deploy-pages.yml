name: Deploy VETTA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify application entry
        run: |
          node --check app.js
          node --check sw.js
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const app = fs.readFileSync('app.js', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');
          const patch7 = fs.readFileSync('parts/patch-07.part', 'utf8');
          const patch8 = fs.readFileSync('parts/patch-08.part', 'utf8');

          assert.ok(index.includes('app.js?v=3.5.0'), 'index deve carregar somente app.js 3.5.0');
          assert.ok(app.includes("const RELEASE = '3.5.0'"), 'app.js deve identificar a versão 3.5.0');
          assert.ok(!app.includes('patch-07.part'), 'app.js não deve executar o patch de migração legado');
          assert.ok(!app.includes('patch-08.part'), 'app.js não deve executar handlers legados');
          assert.ok(!app.includes('stopImmediatePropagation'), 'entrada principal não deve bloquear listeners concorrentes');
          assert.ok(!patch7.includes('app.render'), 'patch 07 deve permanecer neutro');
          assert.ok(!patch8.includes('onclick'), 'patch 08 não pode reinstalar handlers');
          console.log('VETTA 3.5.0 entry verification passed');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

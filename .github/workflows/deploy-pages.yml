name: Publish Active Development Branch to gh-pages

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-development
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'feature/') ||
      startsWith(github.head_ref, 'refactor/') ||
      github.head_ref == 'develop'
    runs-on: ubuntu-latest
    env:
      VETTA_DEV_BRANCH: ${{ github.head_ref || github.ref_name }}
      VETTA_DEV_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VETTA_DEV_PR: ${{ github.event.pull_request.number || 'manual' }}
    steps:
      - name: Checkout exact working branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source

      - name: Confirm publication source
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$VETTA_DEV_SHA"
          echo "Publishing branch: $VETTA_DEV_BRANCH"
          echo "Publishing commit: $VETTA_DEV_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: source
        run: npm install --no-audit --no-fund

      - name: Verify development candidate
        working-directory: source
        run: |
          node --check app.js
          node --check sw.js
          npm run check:platform
          npm run check:pwa-gate
          npm run check:didactic-language
          npm run check:onboarding
          npm run check:vite
          node tests/verify-production.mjs

      - name: Build exact Vite dist
        working-directory: source
        run: npm run build

      - name: Verify Vite dist
        working-directory: source
        run: npm run verify:vite-build

      - name: Install Chromium for development flow
        working-directory: source
        run: npx playwright install --with-deps chromium

      - name: Test all flows against Vite dist
        working-directory: source
        run: npm run test:pages-e2e

      - name: Checkout gh-pages publisher branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publisher

      - name: Publish Vite dist to gh-pages
        run: |
          find publisher -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R source/dist/. publisher/
          cd publisher
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Published content already matches this build."
            exit 0
          fi
          git commit -m "dev: publish Vite ${VETTA_DEV_BRANCH}@${VETTA_DEV_SHA}"
          git push origin gh-pages

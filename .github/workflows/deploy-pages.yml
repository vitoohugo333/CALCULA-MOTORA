name: Publish Active Development Branch to gh-pages

on:
  push:
    branches:
      - 'feature/**'
      - 'refactor/**'
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-development
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VETTA_DEV_BRANCH: ${{ github.ref_name }}
      VETTA_DEV_SHA: ${{ github.sha }}
      VETTA_DEV_PR: branch
    steps:
      - name: Checkout exact working branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Confirm publication source
        run: |
          test "$(git rev-parse HEAD)" = "$VETTA_DEV_SHA"
          echo "Publishing branch: $VETTA_DEV_BRANCH"
          echo "Publishing commit: $VETTA_DEV_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify development candidate
        run: |
          node --check app.js
          node --check sw.js
          npm run check:platform
          npm run check:pwa-gate
          node tests/verify-production.mjs

      - name: Prepare exact GitHub Pages development artifact
        run: npm run prepare:pages

      - name: Install Chromium for development flow
        run: npx playwright install --with-deps chromium

      - name: Test required PWA installation flow
        run: npm run test:pages-e2e

      - name: Publish generated site to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "dev: publish ${VETTA_DEV_BRANCH}@${VETTA_DEV_SHA}"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

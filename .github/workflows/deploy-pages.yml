name: Deploy Active Development Branch to GitHub Pages

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-development
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'feature/') ||
      startsWith(github.head_ref, 'refactor/') ||
      github.head_ref == 'develop'
    runs-on: ubuntu-latest
    environment:
      name: github-pages-development
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VETTA_DEV_BRANCH: ${{ github.head_ref || github.ref_name }}
      VETTA_DEV_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VETTA_DEV_PR: ${{ github.event.pull_request.number || 'manual' }}
    steps:
      - name: Checkout exact working branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Confirm deployment source
        run: |
          test "$(git rev-parse HEAD)" = "$VETTA_DEV_SHA"
          echo "Publishing branch: $VETTA_DEV_BRANCH"
          echo "Publishing commit: $VETTA_DEV_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify development candidate
        run: |
          node --check app.js
          node --check sw.js
          npm run check:platform
          npm run check:pwa-gate
          node tests/verify-production.mjs

      - name: Prepare exact GitHub Pages development artifact
        run: npm run prepare:pages

      - name: Install Chromium for development flow
        run: npx playwright install --with-deps chromium

      - name: Test required PWA installation flow
        run: npm run test:pages-e2e

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload development site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy exact working branch artifact
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy VETTA Development to GitHub Pages

on:
  push:
    branches:
      - 'feature/**'
      - 'refactor/**'
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-development
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify development candidate
        run: |
          node --check app.js
          node --check sw.js
          npm run check:platform
          node tests/verify-production.mjs

      - name: Prepare GitHub Pages development site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html app.js styles.css manifest.webmanifest icon.svg sw.js _site/
          if [ -d src ]; then cp -R src _site/src; fi
          touch _site/.nojekyll
          cat > _site/robots.txt <<'TXT'
          User-agent: *
          Disallow: /
          TXT

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload development site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy development site
        id: deployment
        uses: actions/deploy-pages@v4

name: Consolidate VETTA source

on:
  push:
    branches:
      - refactor-monolith-3-5-0

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor-monolith-3-5-0

      - name: Build single-source application
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import shutil

          release = '3.5.0'
          root = Path('.')
          ui_files = [root / 'parts' / f'ui-{index:02d}.part' for index in range(1, 5)]
          source_files = [root / 'parts' / f'app-{index:02d}.part' for index in range(1, 10)]
          source_files += [root / 'parts' / f'patch-{index:02d}.part' for index in range(1, 7)]

          ui = ''.join(path.read_text(encoding='utf-8') for path in ui_files)
          source = ''.join(path.read_text(encoding='utf-8') for path in source_files)

          init_marker = '\napp.init();\n'
          if source.count(init_marker) != 1:
              raise SystemExit(f'Esperava um app.init() no código-base; encontrei {source.count(init_marker)}')
          source = source.replace(init_marker, '\n', 1)

          source += f'''\n\nconst APP_RELEASE = '{release}';
          const CURRENT_STATE_VERSION = 9;
          const OBSOLETE_STORAGE_KEYS = ['vetta-driver-intelligence-v2', 'vetta-state'];

          const cleanCurrentCost = cost => {{
            const technicalName = /custos?\\s+fixos?\\s+(migrados?|iniciais?)/i.test(cost?.name || '');
            const technicalId = ['fixed-migrated', 'fixed-default'].includes(cost?.id);
            return {{
              ...cost,
              name: technicalName || technicalId ? 'Outros custos mensais' : cost.name,
              legacySource: false
            }};
          }};

          const normalizeCurrentState = app.normalizeState;
          app.normalizeState = function(value) {{
            const normalized = normalizeCurrentState.call(this, value);
            normalized.costs = Array.isArray(normalized.costs) ? normalized.costs.map(cleanCurrentCost) : [];
            normalized.closings = Array.isArray(normalized.closings) ? normalized.closings : [];
            delete normalized.migrationNotice;
            normalized.version = CURRENT_STATE_VERSION;
            normalized.release = APP_RELEASE;
            return normalized;
          }};

          const migrateCurrentState = app.migrateLegacy;
          app.migrateLegacy = function(value) {{
            return this.normalizeState(migrateCurrentState.call(this, value));
          }};

          const renderCurrentRelease = app.render;
          app.render = function() {{
            renderCurrentRelease.call(this);
            const label = this.$('appVersionLabel');
            if (label) label.textContent = `Versão ${{APP_RELEASE}}`;
          }};

          const initCurrentRelease = app.init;
          app.init = function() {{
            initCurrentRelease.call(this);
            OBSOLETE_STORAGE_KEYS.forEach(key => localStorage.removeItem(key));
            this.state = this.normalizeState(this.state || this.cloneDefaults());
            this.save();
            this.render();
          }};

          window.__vettaApp = app;
          app.init();
          '''

          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          replacement = ui + f'\n<script src="./app.js?v={release}" defer></script>'
          pattern = re.compile(r'<div id="appRoot">.*?</div><script src="[^"]+" defer></script>', re.S)
          index, count = pattern.subn(replacement, index, count=1)
          if count != 1:
              raise SystemExit('Não foi possível substituir o carregador antigo no index.html')
          index_path.write_text(index, encoding='utf-8')

          (root / 'app.js').write_text(source, encoding='utf-8')

          sw_path = root / 'sw.js'
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r'vetta-v\\d+\\.\\d+\\.\\d+', f'vetta-v{release}', sw)
          sw = re.sub(r"url\\.searchParams\\.set\('vetta','[^']+'\)", f"url.searchParams.set('vetta','{release}')", sw)
          sw_path.write_text(sw, encoding='utf-8')

          shutil.rmtree(root / 'parts')
          for obsolete in ('vetta-3.4.3.js', 'vetta-3.4.4.js'):
              path = root / obsolete
              if path.exists():
                  path.unlink()

          workflow = root / '.github' / 'workflows' / 'refactor-monolith.yml'
          workflow.unlink()

          tests = root / 'tests'
          tests.mkdir(exist_ok=True)
          (tests / 'verify-monolith.mjs').write_text(f'''import {{ readFileSync }} from 'node:fs';
          import assert from 'node:assert/strict';

          const app = readFileSync('app.js', 'utf8');
          const index = readFileSync('index.html', 'utf8');
          const sw = readFileSync('sw.js', 'utf8');

          assert.equal((app.match(/app\\.init\\(\\);/g) || []).length, 1, 'app deve inicializar exatamente uma vez');
          assert.equal((app.match(/saveCostButton'\\)\\.addEventListener\\('click'/g) || []).length, 1, 'botão de custo deve ter um único listener');
          assert.ok(!app.includes('parts/'), 'app não pode carregar partes em runtime');
          assert.ok(!index.includes('vetta-3.4'), 'index não pode carregar o recuperador antigo');
          assert.ok(index.includes('app.js?v={release}'), 'index deve carregar o app principal versionado');
          assert.ok(sw.includes("vetta-v{release}"), 'service worker deve usar o cache atual');
          console.log('monolith verification passed');
          ''', encoding='utf-8')
          PY

      - name: Verify JavaScript and architecture
        run: |
          node --check app.js
          node --check sw.js
          node tests/verify-monolith.mjs

      - name: Commit consolidated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolida VETTA 3.5.0 em código principal"
          git push origin HEAD:refactor-monolith-3-5-0

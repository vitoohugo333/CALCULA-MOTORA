name: Netlify first deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'netlify.toml'
      - '.github/workflows/netlify-first-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'netlify.toml'
      - '.github/workflows/netlify-first-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy to Netlify
        run: >-
          npx -y @netlify/mcp@latest

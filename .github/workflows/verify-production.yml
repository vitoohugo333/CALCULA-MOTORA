name: Verify VETTA Production

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare exact production files
        run: |
          test ! -d parts
          test ! -f vetta-3.4.3.js
          test ! -f vetta-3.4.4.js
          test ! -f netlify/edge-functions/access-gate.js
          rm -rf _site
          mkdir _site
          cp index.html app.js styles.css manifest.webmanifest icon.svg sw.js _site/

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify public production and modular foundation
        run: |
          node --check app.js
          node --check sw.js
          npm run check:platform
          node tests/verify-production.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test cost modal end to end
        run: npm run test:e2e

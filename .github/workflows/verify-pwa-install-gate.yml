name: Verify Development Experience

on:
  pull_request:
    paths:
      - 'src/**'
      - 'pwa-install-gate.js'
      - 'pwa-install-gate.css'
      - 'didactic-language.js'
      - 'didactic-language.css'
      - 'onboarding-experience.js'
      - 'onboarding-experience.css'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright.pages.config.js'
      - 'vite.config.js'
      - 'manifest.webmanifest'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'apple-touch-icon.png'
      - 'package.json'
      - '.github/workflows/verify-pwa-install-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VETTA_DEV_BRANCH: ${{ github.head_ref || github.ref_name }}
      VETTA_DEV_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VETTA_DEV_PR: ${{ github.event.pull_request.number || 'manual' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify inherited platform and production structure
        run: |
          node --check app.js
          node --check sw.js
          npm run check:platform
          node tests/verify-production.mjs

      - name: Verify installation experience
        run: npm run check:pwa-gate

      - name: Verify didactic language
        run: npm run check:didactic-language

      - name: Verify persistent onboarding
        run: npm run check:onboarding

      - name: Verify Vite modules
        run: npm run check:vite

      - name: Build Vite dist
        run: npm run build

      - name: Verify Vite dist
        run: npm run verify:vite-build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test installation gate against Vite dist
        run: npx playwright test --config=playwright.pages.config.js tests/pages-e2e/pwa-install-gate.spec.js --grep "bloqueia|Safari do iPhone|fallback curto"

      - name: Test didactic flows against Vite dist
        run: npx playwright test --config=playwright.pages.config.js tests/pages-e2e/pwa-install-gate.spec.js --grep "configurações|registro diário|novo usuário|simulador|modo instalado"

      - name: Test onboarding flows against Vite dist
        run: npx playwright test --config=playwright.pages.config.js tests/pages-e2e/onboarding-experience.spec.js

      - name: Test financial and storage parity
        run: npx playwright test --config=playwright.pages.config.js tests/pages-e2e/vite-parity.spec.js --grep "dist é carregado"

      - name: Test Vite build identity and inherited modules
        run: npx playwright test --config=playwright.pages.config.js tests/pages-e2e/vite-parity.spec.js --grep "dist preserva"
